name: ci

on:
  pull_request:
  push:
    branches: [main]

# This workflow only reads the repository.
permissions:
  contents: read

# One run per ref. A newer push cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -coverprofile cover.out

      # The generated ClusterRole is the provider's real permission set. A hand
      # edit to the ClusterRole disappears silently on the next regeneration,
      # which leaves a controller wedged on a denied informer while its pod
      # still reports Ready. This step fails the build when the committed
      # manifests do not match the markers that generate them.
      - name: Verify generated manifests are current
        run: |
          make manifests generate
          git diff --exit-code -- config internal

  telemetry:
    name: Instance log delivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Exercise the shipped collector configuration against local Kubernetes
      # and OTLP test servers. No cluster or hardware virtualization is needed.
      - name: Install Kustomize
        run: make kustomize

      - name: Install the collector used by the shared telemetry contract
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output otelcol.tar.gz \
            https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.144.0/otelcol-contrib_0.144.0_linux_amd64.tar.gz
          echo '4429eecfb311e35f846af453d46c0a8a72e6773489e8105fb049f5bc9edec022  otelcol.tar.gz' | sha256sum --check
          tar -xzf otelcol.tar.gz otelcol-contrib

      - name: Verify instance log collection and delivery
        env:
          OTELCOL_BIN: ${{ runner.temp }}/otelcol-contrib
          KUSTOMIZE_BIN: ${{ github.workspace }}/bin/kustomize
        run: go test -count=1 -timeout=5m ./test/telemetry

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Keep this version in step with GOLANGCI_LINT_VERSION in the Makefile, so
      # that a local `make lint` and CI reach the same verdict. The go.mod file
      # sets the floor. golangci-lint refuses to load a configuration whose
      # target Go version is newer than the Go release that built the linter,
      # and v2.9.0 is the first release built with Go 1.26.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9.0

  # Every overlay has to be deployable, so this job renders each overlay on its
  # own.
  validate-kustomize:
    uses: datum-cloud/actions/.github/workflows/validate-kustomize.yaml@v1.20.0
