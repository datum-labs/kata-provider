name: ci

on:
  pull_request:
  push:
    branches: [main]

# This workflow only reads the repository.
permissions:
  contents: read

# One run per ref; a newer push cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -coverprofile cover.out

      # The generated ClusterRole is the provider's real permission set, and a
      # hand-edit to it silently disappears on the next regeneration — leaving a
      # controller wedged on a denied informer while its pod still reports
      # Ready. Fail the build if the committed manifests do not match the
      # markers they are generated from.
      - name: Verify generated manifests are current
        run: |
          make manifests generate
          git diff --exit-code -- config internal

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Keep this version in step with GOLANGCI_LINT_VERSION in the Makefile, so
      # that a local `make lint` and CI reach the same verdict. The go.mod file
      # sets the floor. golangci-lint refuses to load a configuration whose
      # target Go version is newer than the Go release that built the linter,
      # and v2.9.0 is the first release built with Go 1.26.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9.0

  # Every overlay has to be deployable, so each is rendered on its own.
  validate-kustomize:
    uses: datum-cloud/actions/.github/workflows/validate-kustomize.yaml@v1.20.0
