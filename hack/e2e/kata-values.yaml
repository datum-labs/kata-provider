# Helm values for kata-deploy.
#
# Helm is the only supported way to install Kata 4.x. The kata-deploy.yaml
# manifests that earlier instructions point at no longer exist in the Kata
# repository.
k8sDistribution: "k8s"

# A single-node Kind cluster has only the control-plane node, so kata-deploy has
# to install the runtime there.
nodeSelector:
  node-role.kubernetes.io/control-plane: ""
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# Install only the QEMU shim. QEMU is the handler that the provider targets by
# default, and every extra shim pulls another guest image and kernel onto the
# node for no benefit.
shims:
  disableAll: true
  qemu:
    enabled: true

# kata-deploy creates the RuntimeClass objects itself. The provider's
# kata_runtimeclass component therefore stays off in this environment.
runtimeClasses:
  enabled: true

# Kata 4.0 made runtime-rs the default shim on arm64. The provider targets the
# Go `qemu` shim, so these values name that shim explicitly. The default
# otherwise differs by architecture.
defaultShim:
  arm64: qemu
  amd64: qemu

debug: true
