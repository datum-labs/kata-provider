# The portable tier's cluster: an ordinary single-node Kind cluster.
#
# The cluster takes nothing from the host. The tier deliberately runs no
# hypervisor, so any machine and any GitHub runner can create this cluster. The
# suites that the cluster hosts assert on what the provider itself decides.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kata-provider-runc
nodes:
  - role: control-plane
