# The Kata tier's cluster: a single-node Kind cluster that can run a hypervisor.
#
# Kata boots a VM per instance from inside the node container, so the node needs
# the host's KVM device and the host's kernel modules. Without /dev/kvm the
# guest cannot be created at all and every instance stays in ContainerCreating.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kata
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /dev/kvm
        containerPath: /dev/kvm
      - hostPath: /lib/modules
        containerPath: /lib/modules
        readOnly: true
