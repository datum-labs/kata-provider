- name: old node samples are not attributed to replacement Pod
  interval: 30s
  input_series:
  - series: container_cpu_usage_seconds_total{job="kubelet-resource",node="old-worker",namespace="a",pod="app",container="app"}
    values: 0+3x12
  - series: container_memory_working_set_bytes{job="kubelet-resource",node="old-worker",namespace="a",pod="app",container="app"}
    values: 10x12
  - series: kube_pod_info{namespace="a",pod="app",node="worker",uid="current"}
    values: 1x12
  - series: kube_pod_runtimeclass_name_info{uid="current",namespace="a",pod="app",runtimeclass_name="katars"}
    values: 1x12
  - series: kube_pod_labels{uid="current",namespace="a",pod="app",label_upstream_instance="instance"}
    values: 1x12
  - series: kube_namespace_labels{namespace="a",label_meta_datumapis_com_upstream_cluster_name="cluster-project"}
    values: 1x12
