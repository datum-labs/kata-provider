# A stock nginx image, which cannot start with every capability removed: its
# entrypoint changes the ownership of its cache directories, and its workers
# switch to an unprivileged user.
#
# The security context below is what compute writes onto a container that states
# none: the general-purpose class's published default. Compute's admission
# webhook does not run in a cell, and a test applies an Instance directly, so the
# test states the default itself, exactly as a customer would read it back on
# their own workload.
#
# A provider claims on the runtime-class label. Compute stamps the label from
# spec.runtime.class, so the test stamps it too.
apiVersion: compute.datumapis.com/v1alpha
kind: Instance
metadata:
  name: capabilities
  labels:
    compute.datumapis.com/runtime-class: general-purpose
spec:
  runtime:
    class: general-purpose
    resources:
      instanceType: datumcloud/d1-standard-2
    sandbox:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27
          ports:
            - name: http
              port: 80
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - FSETID
                - KILL
                - NET_BIND_SERVICE
                - SETGID
                - SETPCAP
                - SETUID
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
  networkInterfaces:
    - name: eth0
      network:
        name: default
