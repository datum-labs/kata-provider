apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: container-capabilities
  labels:
    tier: portable
spec:
  description: |
    Proves that an instance runs the security configuration its workload states,
    and nothing more.

    nginx is the case that motivated the published default: with every
    capability removed it cannot change the ownership of its cache directories
    and exits on boot. The instance states the general-purpose class's published
    default, which is what compute writes onto a container that states none. The
    suite asserts on what a customer or an operator would notice:

      - The class this repository registers is accepted by compute's schema, so
        every capability name it publishes and grants is one compute recognizes.
      - The container runs with drop: [ALL] and exactly the capabilities the
        workload states, with nothing added by the platform.
      - Privilege escalation and the seccomp profile are the ones the workload
        states.
      - The instance is available, has not restarted, and serves.

  template: true

  steps:
    - name: register-the-class
      description: |
        Apply the RuntimeClass this repository ships. Compute's schema checks
        each grantable capability against the Linux capability names, so a
        misspelled or invented name fails here rather than in a cell.
      try:
        - apply:
            file: ../../../config/components/runtime_classes/general-purpose.yaml

    - name: create-instance
      description: Ask for nginx with the capabilities it needs.
      try:
        - apply:
            file: instance.yaml

    - name: assert-the-container-runs-what-it-states
      description: |
        The container drops everything and adds back exactly what the workload
        states. A capability here that the instance does not state would be one
        the customer cannot read, audit, or remove.
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: capabilities
              spec:
                runtimeClassName: ($values.runtimeClass)
                containers:
                  - name: nginx
                    securityContext:
                      allowPrivilegeEscalation: false
                      seccompProfile:
                        type: RuntimeDefault
                      capabilities:
                        drop:
                          - ALL
                        add:
                          - CHOWN
                          - DAC_OVERRIDE
                          - FOWNER
                          - FSETID
                          - KILL
                          - NET_BIND_SERVICE
                          - SETGID
                          - SETPCAP
                          - SETUID
              status:
                phase: Running
                containerStatuses:
                  - name: nginx
                    ready: true
                    restartCount: 0

    - name: assert-nothing-was-added
      description: |
        The assertion above matches a list by content, so it would also pass if
        the platform had added a capability. Counting them closes that gap.
      try:
        - script:
            content: |
              granted=$(kubectl -n "$NAMESPACE" get pod capabilities \
                -o jsonpath='{.spec.containers[0].securityContext.capabilities.add[*]}')
              count=$(echo $granted | wc -w | tr -d ' ')
              if [ "$count" != "9" ]; then
                echo "the pod grants $count capabilities, want the 9 the instance states: $granted" >&2
                exit 1
              fi
              echo "the pod grants only what the instance states"

    - name: assert-instance-is-available
      try:
        - assert:
            resource:
              apiVersion: compute.datumapis.com/v1alpha
              kind: Instance
              metadata:
                name: capabilities
              status:
                (conditions[?type == 'Programmed'] | [0]):
                  status: "True"
                  reason: Programmed
                (conditions[?type == 'Available'] | [0]):
                  status: "True"
                  reason: Available

    - name: assert-instance-serves
      description: |
        A running process is not enough: nginx exits on a failed chown only
        after it reports started, so the suite asks it for a page.
      try:
        - script:
            content: |
              code=$(kubectl -n "$NAMESPACE" exec capabilities -c nginx -- \
                curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/)
              if [ "$code" != "200" ]; then
                echo "nginx answered $code, want 200" >&2
                exit 1
              fi
              echo "nginx serves"
