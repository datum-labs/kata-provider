# An instance compute has created but is not yet willing to have started —
# quota not yet granted, placement not yet settled. The gate is compute's way of
# saying so.
apiVersion: compute.datumapis.com/v1alpha
kind: Instance
metadata:
  name: gated
  labels:
    compute.datumapis.com/runtime-class: general-purpose
spec:
  runtime:
    class: general-purpose
    resources:
      instanceType: datumcloud/d1-standard-2
    sandbox:
      containers:
        - name: app
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
  controller:
    templateHash: e2e-scheduling-gates
    schedulingGates:
      - name: compute.datumapis.com/quota
  networkInterfaces:
    - name: eth0
      network:
        name: default
---
# A companion instance the provider does serve, in the same namespace.
#
# The assertions below are about something NOT happening, and absence proves
# nothing unless the provider was live and had reached this namespace. This
# instance running is what makes that true; without it the suite would pass just
# as happily against a provider that had crashed on startup.
apiVersion: compute.datumapis.com/v1alpha
kind: Instance
metadata:
  name: canary
  labels:
    compute.datumapis.com/runtime-class: general-purpose
spec:
  runtime:
    class: general-purpose
    resources:
      instanceType: datumcloud/d1-standard-2
    sandbox:
      containers:
        - name: app
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
  networkInterfaces:
    - name: eth0
      network:
        name: default
