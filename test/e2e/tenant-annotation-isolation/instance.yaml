# An instance whose metadata carries every kind of runtime configuration a
# tenant might try to smuggle through it.
#
# Instance metadata is tenant-writable — a customer can put anything here — and
# Kata reads io.katacontainers.* Pod annotations as host-root configuration.
# The values below are the real shapes: replace the hypervisor binary, take over
# the guest init, turn off guest seccomp, redirect the OCI bundle path.
apiVersion: compute.datumapis.com/v1alpha
kind: Instance
metadata:
  name: hostile-metadata
  labels:
    compute.datumapis.com/runtime-class: general-purpose
  annotations:
    io.katacontainers.config.hypervisor.kernel_params: "init=/bin/sh"
    io.katacontainers.config.hypervisor.path: "/bin/false"
    io.katacontainers.config.hypervisor.enable_iommu: "true"
    io.katacontainers.config.runtime.disable_guest_seccomp: "true"
    io.katacontainers.pkg.oci.bundle_path: "/tmp/escape"
    example.com/harmless: "not-runtime-configuration"
spec:
  runtime:
    class: general-purpose
    resources:
      instanceType: datumcloud/d1-standard-2
    sandbox:
      containers:
        - name: app
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
  networkInterfaces:
    - name: eth0
      network:
        name: default
