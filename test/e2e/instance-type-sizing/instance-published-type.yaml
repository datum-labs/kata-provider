# Names the published InstanceType (instance-type.yaml) and sets no container
# resources, so the Pod's limits can only come from that object.
#
# A provider claims on the runtime-class label. Compute stamps the label from
# spec.runtime.class, so the test stamps it too.
apiVersion: compute.datumapis.com/v1alpha
kind: Instance
metadata:
  name: e2e-published-type-instance
  labels:
    compute.datumapis.com/runtime-class: general-purpose
spec:
  runtime:
    class: general-purpose
    resources:
      instanceType: e2e-custom-2cpu-1gi
    sandbox:
      containers:
        - name: app
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
  networkInterfaces:
    - name: eth0
      network:
        name: default
