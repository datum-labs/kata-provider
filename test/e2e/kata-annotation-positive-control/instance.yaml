# An instance whose metadata asks for a kernel command line argument in the
# guest that isolates the tenant.
apiVersion: compute.datumapis.com/v1alpha
kind: Instance
metadata:
  name: tenant-request
  labels:
    compute.datumapis.com/runtime-class: general-purpose
  annotations:
    io.katacontainers.config.hypervisor.kernel_params: "kata_e2e_tenant_marker=1"
spec:
  runtime:
    class: general-purpose
    resources:
      instanceType: datumcloud/d1-standard-2
    sandbox:
      containers:
        - name: app
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
  networkInterfaces:
    - name: eth0
      network:
        name: default
