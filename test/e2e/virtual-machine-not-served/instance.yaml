# A virtual machine instance: a customer-supplied operating system image booted
# directly, rather than containers run inside a platform-owned guest.
#
# The class does not declare that capability, so compute refuses the instance at
# apply time. This instance is applied straight to the cell, with no compute
# webhook in front of it. That is the shape of an instance created before the
# validation existed.
apiVersion: compute.datumapis.com/v1alpha
kind: Instance
metadata:
  name: virtual-machine
  labels:
    compute.datumapis.com/runtime-class: general-purpose
spec:
  runtime:
    class: general-purpose
    resources:
      instanceType: datumcloud/d1-standard-2
    virtualMachine:
      volumeAttachments:
        - name: boot
          mountPath: /
  volumes:
    - name: boot
      configMap:
        name: boot-image
  networkInterfaces:
    - name: eth0
      network:
        name: default
---
# A companion instance that the provider does serve, in the same namespace.
#
# The assertions in this suite are about something not happening, and absence
# proves nothing unless the provider was live and had reached this namespace. A
# running companion instance is what makes absence meaningful. Without the
# companion, the suite would pass just as happily against a provider that had
# crashed on startup.
apiVersion: compute.datumapis.com/v1alpha
kind: Instance
metadata:
  name: canary
  labels:
    compute.datumapis.com/runtime-class: general-purpose
spec:
  runtime:
    class: general-purpose
    resources:
      instanceType: datumcloud/d1-standard-2
    sandbox:
      containers:
        - name: app
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
  networkInterfaces:
    - name: eth0
      network:
        name: default
