apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The e2e deployment of the provider.
#
# It is the real base and the real generated RBAC — the point of deploying
# in-cluster rather than running the binary from a terminal is that the suites
# then exercise the manifests and the ServiceAccount permissions a cell would
# actually get, so a missing grant fails a test instead of shipping.
#
# Two things differ from config/overlays/dev, both because the environment
# supplies them itself:
#   - no kata_runtimeclass component: the tier installs the RuntimeClass, either
#     kata-deploy's or the runc-handled stand-in.
#   - no leader election: one replica, and a restart should come straight back
#     rather than wait out a lease.
namespace: kata-provider-system

resources:
  - namespace.yaml
  - ../../../config/base/manager

components:
  - ../../../config/components/controller_rbac

images:
  - name: ghcr.io/datum-labs/kata-provider
    newTag: e2e

patches:
  - path: deployment_patch.yaml
