apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The end-to-end deployment of the provider.
#
# The overlay uses the real base and the real generated role-based access
# control (RBAC). Deploying in-cluster, rather than running the binary from a
# terminal, makes the suites exercise the manifests and the ServiceAccount
# permissions that a cell would get. A missing grant then fails a test rather
# than shipping.
#
# Two things differ from config/overlays/dev, because the environment supplies
# both itself:
#   - The overlay omits the kata_runtimeclass component, because the tier
#     installs the RuntimeClass, either kata-deploy's or the runc-handled
#     stand-in.
#   - The overlay omits leader election, because the deployment runs one replica
#     and a restart should return immediately rather than wait out a lease.
namespace: kata-provider-system

resources:
  - namespace.yaml
  - ../../../config/base/manager

components:
  - ../../../config/components/controller_rbac

images:
  - name: ghcr.io/datum-labs/kata-provider
    newTag: e2e

patches:
  - path: deployment_patch.yaml
