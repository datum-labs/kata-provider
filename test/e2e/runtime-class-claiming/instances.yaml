# Two instances in one namespace, one per runtime class, exactly as a cell that
# serves both classes would hold them.
apiVersion: compute.datumapis.com/v1alpha
kind: Instance
metadata:
  name: claimed
  labels:
    compute.datumapis.com/runtime-class: general-purpose
spec:
  runtime:
    class: general-purpose
    resources:
      instanceType: datumcloud/d1-standard-2
    sandbox:
      containers:
        - name: app
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
  networkInterfaces:
    - name: eth0
      network:
        name: default

---
# Identical to the instance above in every respect except the class it asks for.
# If the provider claimed on workload shape rather than on class, nothing here
# would distinguish the two instances.
apiVersion: compute.datumapis.com/v1alpha
kind: Instance
metadata:
  name: other-class
  labels:
    compute.datumapis.com/runtime-class: unikernel
spec:
  runtime:
    class: unikernel
    resources:
      instanceType: datumcloud/d1-standard-2
    sandbox:
      containers:
        - name: app
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
  networkInterfaces:
    - name: eth0
      network:
        name: default
