# An instance in the general-purpose runtime class: an ordinary Linux container
# image, isolated in its own kernel. The same instance runs in the unikernel
# class only if its image satisfies that class's compatibility contract; this
# class is the one where any image runs.
apiVersion: compute.datumapis.com/v1alpha
kind: Instance
metadata:
  name: sample-general-purpose-instance
  labels:
    # Providers claim instances by this label. Compute stamps it from
    # spec.runtime.class; it is shown here because a hand-applied sample has no
    # controller to stamp it.
    compute.datumapis.com/runtime-class: general-purpose
spec:
  runtime:
    class: general-purpose
    resources:
      instanceType: datumcloud/d1-standard-2
    sandbox:
      # A router can enable forwarding before its containers start. Uncomment
      # the block below only after every selected kubelet admits these exact
      # unsafe sysctl names. The IPv6 default applies to later TUN interfaces.
      # sysctls:
      #   - name: net.ipv4.ip_forward
      #     value: "1"
      #   - name: net.ipv6.conf.all.forwarding
      #     value: "1"
      #   - name: net.ipv6.conf.default.forwarding
      #     value: "1"
      containers:
        - name: app
          image: docker.io/library/nginx:latest
          ports:
            - name: http
              port: 80
  networkInterfaces:
    - name: eth0
      network:
        name: default
