apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Opt-in: kata-deploy creates this object itself on the clusters it installs.
# A deployment enables this component only where the runtime was installed by
# other means and nothing else declares the RuntimeClass. Installing the shim on
# a node reboots it, so a cell schedules that separately from enabling this.
resources:
  - runtimeclass.yaml
