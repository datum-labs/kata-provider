# The Kubernetes RuntimeClass that points the kubelet at the Rust runtime-rs
# shim. It is not Datum's runtime class: this is the node-level runtime binding
# that a general-purpose instance's Pod names, and it must exist in the cluster
# before any such Pod can be admitted.
#
# runtime-rs is the shim Kata 4.x makes its default, and katars is the handler
# name kata-deploy installs it under. The handler name must match the provider's
# runtimeHandler setting, so a cell enables this component and sets that
# setting together.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: katars
  labels:
    app.kubernetes.io/name: kata-provider
    app.kubernetes.io/managed-by: kustomize
handler: katars
scheduling:
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
