# Compute owns the RuntimeClass kind and the contract it publishes. Each
# provider registers the classes it serves from its own repository, the way a
# Gateway API implementation registers its own GatewayClass. Adding, retiring,
# or correcting a class this provider serves is a change here, not a change to
# compute.
#
# Every field below is a promise to a customer, so the class declares only what
# a Kata-backed instance delivers today. internal/controller/capabilities.go is
# the same declaration in code, and the provider reports through the Available
# condition when the two disagree. Keep them in step.
apiVersion: compute.datumapis.com/v1alpha
kind: RuntimeClass
metadata:
  name: general-purpose
spec:
  controllerName: compute.datumapis.com/kata-provider
  displayName: General purpose
  description: >-
    Runs arbitrary Linux container images. Slower to start and more expensive
    per instance than the fast path, but an image that runs elsewhere runs here.
  isolation:
    boundary: virtual-machine
    description: >-
      Each instance runs in its own lightweight virtual machine with its own
      kernel. No kernel is shared between tenants.
  capabilities:
    features:
      - sandboxRuntime
      - configMapVolumes
      - secretVolumes
      - envFrom
      - imagePullSecrets
      - containerCapabilities
    # Every Linux capability. A capability acts inside the instance's own
    # virtual machine, whose kernel confines it, so granting one gives no access
    # to the machine running the instance.
    grantableCapabilities:
      - AUDIT_CONTROL
      - AUDIT_READ
      - AUDIT_WRITE
      - BLOCK_SUSPEND
      - BPF
      - CHECKPOINT_RESTORE
      - CHOWN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - FOWNER
      - FSETID
      - IPC_LOCK
      - IPC_OWNER
      - KILL
      - LEASE
      - LINUX_IMMUTABLE
      - MAC_ADMIN
      - MAC_OVERRIDE
      - MKNOD
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_BROADCAST
      - NET_RAW
      - PERFMON
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYSLOG
      - SYS_ADMIN
      - SYS_BOOT
      - SYS_CHROOT
      - SYS_MODULE
      - SYS_NICE
      - SYS_PACCT
      - SYS_PTRACE
      - SYS_RAWIO
      - SYS_RESOURCE
      - SYS_TIME
      - SYS_TTY_CONFIG
      - WAKE_ALARM
    compatibility: >-
      Runs standard Linux container images without modification, including
      images that need a full filesystem, dynamic linking, or credentials to
      pull. A container can request any Linux capability its image needs, such
      as CHOWN or SETUID, and the capability applies only inside the instance's
      own virtual machine. Storage lives with the instance: durable disks and raw device
      attachments are not offered yet, and neither is booting a
      customer-supplied virtual machine image.
  # The security configuration a container in this class gets when it states
  # none. The platform writes these values onto the container at admission, so a
  # customer reads what their container runs with on their own workload instead
  # of inferring it from provider behaviour.
  #
  # The capability set is Docker's default set less the four that reach past an
  # ordinary application: NET_RAW, SYS_CHROOT, MKNOD, and AUDIT_WRITE. What
  # remains is what nginx, Postgres, and any image that uses gosu or su-exec to
  # drop from root to a service account need in order to start. A container that
  # needs more asks for it by name.
  defaultSecurityContext:
    capabilities:
      add:
        - CHOWN
        - DAC_OVERRIDE
        - FOWNER
        - FSETID
        - KILL
        - NET_BIND_SERVICE
        - SETFCAP
        - SETGID
        - SETPCAP
        - SETUID
    # Dropping from root to a service account needs no escalation, so denying it
    # costs a stock image nothing. A container relying on a setuid helper states
    # otherwise for itself.
    allowPrivilegeEscalation: false
    # The container runtime's own profile blocks the system calls an application
    # has no use for. A container needing an unfiltered kernel states Unconfined.
    seccompProfile:
      type: RuntimeDefault

  lifecycle:
    description: >-
      Instances take several seconds to start, dominated by booting a kernel and
      pulling the image. Suspend, resume, and snapshot are not offered yet.

  # A guest in this class reads no node state, so it cannot find a network of
  # its own: the hypervisor is told which host device belongs to the instance,
  # along with the addresses and MTU to configure on it. Declaring that here
  # keeps a cell from having to be configured for the class before an instance
  # of it can reach a tenant network.
  networkAttachment: HypervisorDeclared
