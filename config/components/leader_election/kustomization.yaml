apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - leader_election_role.yaml
  - leader_election_role_binding.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kata-provider
      spec:
        template:
          spec:
            containers:
            - name: manager
              env:
              - name: LEADER_ELECT
                value: "true"
