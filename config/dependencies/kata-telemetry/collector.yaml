# Optional application-log collector. Enable instanceLogs in the provider only
# after this DaemonSet is ready on every node that can run Kata instances.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: kata-telemetry
  labels:
    app.kubernetes.io/part-of: kata-provider
spec:
  mode: daemonset
  serviceAccount: kata-telemetry
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.144.0
  # Match the provider's default selector; environment overlays must replace
  # this when the provider uses another node pool (including shared pools).
  nodeSelector:
    kubernetes.io/os: linux
    katacontainers.io/kata-runtime: "true"
  tolerations:
    - key: compute.datumapis.com/runtime
      operator: Exists
      effect: NoSchedule
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: LOGS_OTLP_ENDPOINT
      value: gateway-collector-collector.o11y-system.svc.cluster.local:4317
  volumes:
    - name: pod-logs
      hostPath:
        path: /var/log/pods
        type: Directory
    - name: storage
      hostPath:
        path: /var/lib/kata-logs-otel
        type: DirectoryOrCreate
  volumeMounts:
    - name: pod-logs
      mountPath: /var/log/pods
      readOnly: true
    - name: storage
      mountPath: /var/lib/otelcol/storage
  config:
    extensions:
      file_storage:
        directory: /var/lib/otelcol/storage
        fsync: true
    receivers:
      filelog:
        # Read regular CRI files, not the /var/log/containers symlinks as well.
        # Include uncompressed rotations so downtime does not lose their tail.
        include: [/var/log/pods/*/*/*.log*]
        exclude:
          - /var/log/pods/*/*/*.gz
          - /var/log/pods/kata-telemetry-system_*/*/*.log*
        start_at: beginning
        include_file_path: true
        storage: file_storage
        max_log_size: 1MiB
        poll_interval: 1s
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0s
        operators:
          # The stock container parser accepts only files ending in .log for
          # metadata extraction. Parse paths here to include kubelet rotations.
          - type: regex_parser
            parse_from: attributes["log.file.path"]
            parse_to: attributes["kata.path"]
            regex: '^.*/(?P<namespace>[^_/]+)_(?P<pod>[^_/]+)_(?P<uid>[a-f0-9-]{36})/(?P<container>[^/]+)/[0-9]+\.log(?:\..*)?$'
          - type: move
            from: attributes["kata.path"].namespace
            to: resource["k8s.namespace.name"]
          - type: move
            from: attributes["kata.path"].pod
            to: resource["k8s.pod.name"]
          - type: move
            from: attributes["kata.path"].uid
            to: resource["k8s.pod.uid"]
          - type: move
            from: attributes["kata.path"].container
            to: resource["k8s.container.name"]
          - type: remove
            field: attributes["kata.path"]
          - type: container
            id: container-parser
            add_metadata_from_filepath: false
            max_log_size: 1MiB
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
        spike_limit_mib: 96
      k8sattributes:
        auth_type: serviceAccount
        wait_for_metadata: true
        wait_for_metadata_timeout: 60s
        filter:
          node_from_env_var: K8S_NODE_NAME
          labels:
            - key: managed-by
              value: kata-provider
              op: equals
            - key: telemetry.miloapis.com/otlp-native-logs
              value: "true"
              op: equals
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.pod.uid, k8s.node.name]
          labels:
            - tag_name: datum.instance.name
              key: upstream.instance
              from: pod
            - tag_name: datum.workload.name
              key: compute.datumapis.com/workload-name
              from: pod
            - tag_name: datum.instance.namespace
              key: meta.datumapis.com/upstream-namespace
              from: namespace
            - tag_name: datum.project.name
              key: resourcemanager.miloapis.com/project-name
              from: namespace
      # Never route records with missing ownership to the gateway's internal
      # fallback tenant. Application log bodies remain opaque text.
      filter/identity:
        error_mode: propagate
        logs:
          log_record:
            - 'resource.attributes["datum.project.name"] == nil or resource.attributes["datum.project.name"] == ""'
            - 'resource.attributes["datum.instance.namespace"] == nil or resource.attributes["datum.instance.namespace"] == ""'
            - 'resource.attributes["datum.instance.name"] == nil or resource.attributes["datum.instance.name"] == ""'
      resource/routing:
        attributes:
          # The gateway routes by project_name; datum.* serves compute queries.
          - key: project_name
            from_attribute: datum.project.name
            action: upsert
    exporters:
      otlp_grpc:
        endpoint: ${env:LOGS_OTLP_ENDPOINT}
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0s
        sending_queue:
          enabled: true
          storage: file_storage
          sizer: bytes
          queue_size: 268435456
          num_consumers: 2
    service:
      extensions: [file_storage]
      pipelines:
        logs:
          receivers: [filelog]
          # No in-memory batch processor before the durable export queue.
          processors: [memory_limiter, k8sattributes, filter/identity, resource/routing]
          exporters: [otlp_grpc]
